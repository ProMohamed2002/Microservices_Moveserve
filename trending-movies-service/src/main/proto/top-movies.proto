syntax = "proto3";

package trending;

option java_package = "com.example.trendingmovies";
option java_outer_classname = "TrendingMoviesProto";

service TrendingMovies {
  rpc GetTrendingMovies (Empty) returns (TrendingMoviesResponse);
}

message Empty {}

message TrendingMoviesResponse {
  repeated Movie movies = 1;
}

message Movie {
  string id = 1;
  double rating = 2;
}